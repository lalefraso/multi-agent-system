name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Run application tests
        run: python -m unittest discover -s app/tests -p 'test_*.py'
      - name: Run ingestion tests
        run: python -m unittest discover -s getnet_ingestion/tests -p 'test_*.py'
      - name: Test offline retrieval evaluation
        run: python -m unittest -v retrieval_evaluation.test_evaluate
