services:
  redis-seed:
    build: .
    command: ["python", "-m", "getnet_ingestion.seed"]
    env_file:
      - .env
    environment:
      GETNET_REDIS_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./getnet_ingestion/data:/app/getnet_ingestion/data:ro
    depends_on:
      redis:
        condition: service_healthy

  app:
    build: .
    env_file:
      - .env
    environment:
      GETNET_REDIS_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-getnet-multi-agent}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      redis-seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  redis:
    image: redis/redis-stack-server:7.4.0-v8@sha256:798ab84d9f266936b034ab11c4d04a2b8e4b441884c5aa7d17ac951eefdf742a
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
